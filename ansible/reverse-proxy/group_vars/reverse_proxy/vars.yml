# Must match lab_domain in ansible/gl-inet (the router's *.lab wildcard).
lab_domain: lab

# One line per app: http://<name>.lab -> backend. Add a line and re-run the playbook.
proxy_services:
  - { name: immich, backend: "192.168.2.8:2283" }
  - { name: signal, backend: "192.168.2.100:30090" }
  - { name: jellyfin, backend: "192.168.2.3:8096" }
  - { name: proxmox, backend: "192.168.2.2:8006", https: true, backend_ca: pve-root-ca.pem }
