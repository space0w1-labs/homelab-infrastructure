# Check that the self-hosted runner can pick up jobs from this repo.
# Runs on every pull request, or manually. Fork PRs go to a GitHub-hosted runner
# so outside code never runs on the homelab.
name: Runner test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","homelab"]') }}
    steps:
      - run: |
          hostname
          whoami
          docker version
